[project]
name = "mqa-data"
version = "0.1.0"
description = "Data and code collection for the paper: Mirror Quantum Awesomeness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "marimo>=0.24.0",
    "matplotlib>=3.4",
    "networkx>=3.6.1",
    "numpy>=1.17",
    "pandas>=3.0.3",
    "pylatexenc>=2.11",
    "qiskit>=2.0",
    "qiskit-aer>=0.17.2",
    "qiskit-experiments>=0.13.0",
    "qiskit-ibm-runtime>=0.28",
    "rustworkx>=0.17.1",
    "scipy>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qiskit_device_benchmarking", "mqa_common"]
